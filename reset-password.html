<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Lesson Note Generator</title>

    <!-- CSS FILE -->
    <link rel="stylesheet" href="reset-password.css">
</head>

<body>

    <div class="container">

        <div class="reset-card">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">📚</div>
                <h2>Lesson<span>AI</span></h2>
            </div>

            <!-- Reset Form -->
            <div id="resetSection">

                <h1>Reset Password</h1>

                <p class="subtitle">
                    Create a new password for your account.
                </p>

                <form id="resetForm">

                    <!-- New Password -->
                    <div class="form-group">

                        <label for="password">
                            New Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter new password"
                                required
                            >

                            <button
                                type="button"
                                class="show-btn"
                                onclick="togglePassword('password', this)"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- Password Strength -->
                    <div class="strength-container">

                        <div class="strength-bar">
                            <div id="strengthBar"></div>
                        </div>

                        <p id="strengthText">
                            Password strength
                        </p>

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                                required
                            >

                            <button
                                type="button"
                                class="show-btn"
                                onclick="togglePassword('confirmPassword', this)"
                            >
                                Show
                            </button>

                        </div>

                        <p id="matchMessage"></p>

                    </div>


                    <!-- Reset Button -->
                    <button
                        type="submit"
                        class="reset-btn"
                    >
                        Reset Password
                    </button>

                </form>

                <!-- Back to Login -->
                <a href="login.html" class="back-login">
                    ← Back to Login
                </a>

            </div>


            <!-- Success Message -->
            <div id="successSection" class="success-section">

                <div class="success-icon">
                    ✓
                </div>

                <h1>Password Reset Successful!</h1>

                <p>
                    Your password has been successfully changed.
                    You can now login with your new password.
                </p>

                <a href="login.html" class="login-btn">
                    Continue to Login
                </a>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // SHOW / HIDE PASSWORD
        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "Hide";

            } else {

                input.type = "password";
                button.textContent = "Show";

            }
        }


        // PASSWORD STRENGTH
        const password = document.getElementById("password");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");

        password.addEventListener("input", function () {

            const value = password.value;

            let strength = 0;

            if (value.length >= 8) {
                strength++;
            }

            if (/[A-Z]/.test(value)) {
                strength++;
            }

            if (/[0-9]/.test(value)) {
                strength++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                strength++;
            }


            if (value.length === 0) {

                strengthBar.style.width = "0%";
                strengthText.textContent = "Password strength";

            } else if (strength <= 1) {

                strengthBar.style.width = "25%";
                strengthText.textContent = "Weak password";

            } else if (strength === 2) {

                strengthBar.style.width = "50%";
                strengthText.textContent = "Medium password";

            } else if (strength === 3) {

                strengthBar.style.width = "75%";
                strengthText.textContent = "Good password";

            } else {

                strengthBar.style.width = "100%";
                strengthText.textContent = "Strong password";

            }

        });


        // PASSWORD MATCH CHECK
        const confirmPassword =
            document.getElementById("confirmPassword");

        const matchMessage =
            document.getElementById("matchMessage");

        confirmPassword.addEventListener("input", function () {

            if (confirmPassword.value === "") {

                matchMessage.textContent = "";

            } else if (
                confirmPassword.value === password.value
            ) {

                matchMessage.textContent = "Passwords match ✓";
                matchMessage.className = "match";

            } else {

                matchMessage.textContent = "Passwords do not match";
                matchMessage.className = "no-match";

            }

        });


        // RESET PASSWORD FORM
        const resetForm =
            document.getElementById("resetForm");

        resetForm.addEventListener("submit", function (event) {

            event.preventDefault();


            // Check password length
            if (password.value.length < 8) {

                alert("Password must be at least 8 characters long.");
                return;

            }


            // Check password match
            if (
                password.value !==
                confirmPassword.value
            ) {

                alert("Passwords do not match.");
                return;

            }


            // Hide reset form
            document.getElementById("resetSection")
                .style.display = "none";


            // Show success section
            document.getElementById("successSection")
                .style.display = "block";

        });

    </script>

</body>
</html>
