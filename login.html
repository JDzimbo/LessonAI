<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LessonAI</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-info">
            <div class="logo">Lesson<span>AI</span></div>

            <h1>Welcome Back!</h1>

            <p>
                Login to LessonAI and continue creating
                lesson notes, lesson plans, quizzes and
                schemes of work with AI.
            </p>
        </div>

        <!-- RIGHT SIDE -->
        <div class="login-box">
            <h2>Login</h2>

            <p class="subtitle">
                Login to your LessonAI account
            </p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </div>

                <p
                    id="errorMessage"
                    class="error-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>
            </form>

            <div class="signup-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            errorMessage.textContent = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "https://lessonai-qoqr.onrender.com/api/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email, password })
                    }
                );

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success) {
                    errorMessage.textContent =
                        data.message || "Incorrect email or password.";
                    return;
                }

                // Confirm the backend returned the token and user.
                if (
                    typeof data.token !== "string" ||
                    !data.token ||
                    !data.user ||
                    !data.user.fullname
                ) {
                    errorMessage.textContent =
                        "The server returned an incomplete login response. Please try again.";
                    return;
                }

                // Save the JWT token for authenticated API requests.
                localStorage.setItem("lessonAIToken", data.token);

                // Save non-sensitive user information for the interface.
                localStorage.setItem("lessonAILoggedIn", "true");
                localStorage.setItem(
                    "lessonAIUserName",
                    data.user.fullname
                );
                localStorage.setItem(
                    "lessonAIUser",
                    JSON.stringify(data.user)
                );

                window.location.href = "homepage.html";

            } catch (error) {
                console.error("Login error:", error);

                errorMessage.textContent =
                    "Unable to connect to LessonAI. Please check your internet connection and try again.";

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
