<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LessonAI</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-info">

            <div class="logo">
                Lesson<span>AI</span>
            </div>

            <h1>Welcome Back!</h1>

            <p>
                Login to LessonAI and continue creating
                lesson notes, lesson plans, quizzes and
                schemes of work with AI.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-box">

            <h2>Login</h2>

            <p class="subtitle">
                Login to your LessonAI account
            </p>


            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- FORGOT PASSWORD -->
                <div class="forgot-password">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- ERROR MESSAGE -->
                <p id="errorMessage" class="error-message"></p>


                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-btn" id="loginButton">
                    Login
                </button>

            </form>


            <!-- SIGN UP -->
            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->
    <script>

        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");
        const loginButton = document.getElementById("loginButton");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            // Clear previous error
            errorMessage.textContent = "";


            // Get form values
            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            // Disable button while logging in
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                // Send login information to LessonAI backend
                const response = await fetch(
                    "https://lessonai-qoqr.onrender.com/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                // Get server response
                const data = await response.json();


                // Login failed
                if (!response.ok) {

                    errorMessage.textContent =
                        data.message || "Incorrect email or password.";

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";

                    return;
                }


                // Login successful

                localStorage.setItem(
                    "lessonAILoggedIn",
                    "true"
                );


                // Save user's name
                localStorage.setItem(
                    "lessonAIUserName",
                    data.user.fullname
                );


                // Save safe user information
                // Password is NOT stored
                localStorage.setItem(
                    "lessonAIUser",
                    JSON.stringify(data.user)
                );


                alert("Login successful!");


                // Go to homepage
                window.location.href = "homepage.html";

            }


            catch (error) {

                console.error("Login error:", error);

                errorMessage.textContent =
                    "Unable to connect to LessonAI server. Make sure the backend is running.";

            }


            finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login";

            }

        });

    </script>

</body>
</html>
